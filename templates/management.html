<div class="management-tab">
    <section class="system-status">
        <h2>System Status</h2>
        <div class="status-grid">
            <div class="status-card">
                <span class="label">Total Services</span>
                <span class="value" id="total-services">0</span>
            </div>
            <div class="status-card">
                <span class="label">Running</span>
                <span class="value status-running" id="running-services">0</span>
            </div>
            <div class="status-card">
                <span class="label">Stopped</span>
                <span class="value status-stopped" id="stopped-services">0</span>
            </div>
            <div class="status-card">
                <span class="label">Failed</span>
                <span class="value status-error" id="failed-services">0</span>
            </div>
        </div>
        <div class="system-actions">
            <button id="daemon-reload" class="btn-secondary">Daemon Reload</button>
            <button id="apply-changes" class="btn-primary">Apply All Changes</button>
        </div>
    </section>

    <section class="services-section">
        <div class="section-header">
            <h2>Services</h2>
            <button id="add-service" class="btn-primary">+ Add Service</button>
        </div>
        <div id="services-grid" class="services-grid"
             hx-get="/components/services-grid"
             hx-trigger="load, serviceUpdate from:body"
             hx-swap="innerHTML">
            <!-- Service cards will be loaded here by HTMX -->
            <div class="loading-placeholder">Loading services...</div>
        </div>
    </section>

    <!-- Modal Container (modals loaded via HTMX) -->
    <div id="modal-container"></div>
</div>
